; PlatformIO build for the ESP32-2432S024C HUD.
;
;   pio run -t upload
;   pio device monitor
;
; The display/LVGL settings are shared with the Arduino IDE build: see config/.

[platformio]
src_dir = ship_hud

[env:esp32]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino

; 1.9 MB app partition: the default 1.3 MB one is ~99% full with WiFi
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    lvgl/lvgl@9.2.2
    bodmer/TFT_eSPI@2.5.43

build_flags =
    -I config
    -DLV_CONF_INCLUDE_SIMPLE
    -DUSER_SETUP_LOADED=1
    -include config/User_Setup.h
