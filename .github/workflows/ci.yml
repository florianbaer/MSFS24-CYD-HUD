name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  esp32-compile:
    name: Compile ESP32 sketch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              version: 3.2.0
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          sketch-paths: ship_hud
          libraries: |
            - name: lvgl
              version: 9.2.2
            - name: TFT_eSPI
              version: 2.5.43

  msfs-sender-test:
    name: Protocol & conversion tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test msfs-sender/ --verbosity normal

  msfs-sender-build:
    name: Build sender (.exe)
    runs-on: windows-latest
    needs: msfs-sender-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish single-file exe
        run: >
          dotnet publish msfs-sender/MsfsHudSender/MsfsHudSender.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: msfs-hud-sender
          path: publish/msfs-hud-sender.exe
