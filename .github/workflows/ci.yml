name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  msfs-sender-test:
    name: Protocol & conversion tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test msfs-sender/ --verbosity normal

  msfs-sender-build:
    name: Build sender (.exe)
    runs-on: windows-latest
    needs: msfs-sender-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish single-file exe
        run: >
          dotnet publish msfs-sender/MsfsHudSender/MsfsHudSender.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: msfs-hud-sender
          path: publish/msfs-hud-sender.exe
